<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Email Prioritizer</title>
<style>
  :root { color-scheme: dark light; }
  body { margin:0; height:100vh; display:grid; place-items:center; font:16px system-ui, sans-serif; background:#0f172a; color:#e2e8f0; }
  .box { text-align:center; }
  .spin { width:38px; height:38px; margin:0 auto 18px; border:4px solid #334155; border-top-color:#60a5fa; border-radius:50%; animation:s 0.9s linear infinite; }
  @keyframes s { to { transform:rotate(360deg); } }
  small { color:#94a3b8; }
  .bar { width:min(320px, 70vw); height:8px; margin:18px auto 10px; background:#1e293b; border-radius:999px; overflow:hidden; }
  .fill { height:100%; width:0; background:linear-gradient(90deg,#3b82f6,#60a5fa); border-radius:999px; transition:width .6s ease-out; }
  .pct { font-variant-numeric:tabular-nums; color:#94a3b8; font-size:13px; }
  body { user-select:none; }
</style></head>
<body><div class="box"><div class="spin"></div><div>Starting Email Prioritizer…</div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"><div class="fill" id="fill"></div></div><div class="pct"><span id="pct">0</span>% · <span id="stage">Starting the server</span></div><small id="t">First start of the day takes a little longer.</small></div>
<script>
  var app = 'http://localhost:47613', started = Date.now();
  var STAGES = [[0, 'Starting the server'], [8, 'Loading language tools'], [20, 'Loading the language model'], [45, 'Opening your database'], [70, 'Almost there']];
  function paint(p, label) {
    document.getElementById('fill').style.width = p + '%';
    document.getElementById('pct').textContent = Math.round(p);
    document.getElementById('bar').setAttribute('aria-valuenow', Math.round(p));
    if (label) document.getElementById('stage').textContent = label;
  }
  // The server cannot report real progress while it loads, so the bar is an estimate: it fills quickly,
  // slows down towards 95% and jumps to 100% the moment the server answers.
  setInterval(function () {
    var s = (Date.now() - started) / 1000, label = STAGES[0][1];
    STAGES.forEach(function (st) { if (s >= st[0]) label = st[1]; });
    paint(95 * (1 - Math.exp(-s / 18)), label);
  }, 300);
  function check() {
    fetch('http://127.0.0.1:47613/healthz', { mode: 'no-cors', cache: 'no-store' })
      .then(function () { paint(100, 'Ready'); setTimeout(function () { location.replace(app); }, 350); })
      .catch(function () {
        if (Date.now() - started > 120000) document.getElementById('t').textContent = 'Taking longer than expected. Check local-server.log in the project folder.';
        setTimeout(check, 700);
      });
  }
  check();
</script></body></html>
