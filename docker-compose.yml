x-app: &app
  build: .
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://prioritizer:prioritizer@db:5432/prioritizer
    REDIS_URL: redis://redis:6379/0
    INPROCESS_SYNC: "false"  # Celery worker + beat do the periodic sync
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prioritizer
      POSTGRES_PASSWORD: prioritizer
      POSTGRES_DB: prioritizer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prioritizer"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine

  api:
    <<: *app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: celery -A app.worker.celery_app worker --loglevel=info

  beat:
    <<: *app
    command: celery -A app.worker.celery_app beat --loglevel=info

volumes:
  pgdata:
